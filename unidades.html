<style>
:root {
  --az-prim: #0B3C6F;
  --az-light: #1C5AA0;
  --az-sub: #072545;
  --bg: #F4F7FA;
  --card: #FFFFFF;
  --txt: #16202A;
  --txt-muted: #516170;
  --linha: #D3DBE3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "IBM Plex Sans", sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
}
#screenPin {
  max-width: 360px;
  margin: 50px auto;
  padding: 30px 20px;
  background: #fff;
  border-radius: 16px;
  border: 1px solid var(--linha);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  text-align: center;
}
.pin-icon { font-size: 40px; margin-bottom: 12px; }
.pin-title { font-size: 22px; font-weight: 700; color: var(--az-prim); }
.pin-desc { font-size: 13px; color: var(--txt-muted); margin-top: 4px; margin-bottom: 24px; }
.pin-dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 24px; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--az-prim); background: transparent; transition: all 0.2s; }
.pin-dot.filled { background: var(--az-prim); transform: scale(1.15); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 260px; margin: 0 auto 20px; }
.pad-btn { height: 56px; background: var(--bg); border: 1px solid var(--linha); border-radius: 12px; font-size: 22px; font-weight: 700; color: var(--txt); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.pad-btn:active { background: var(--az-light); color: #fff; transform: scale(0.94); }
.pad-btn.action { font-size: 13px; font-weight: 600; color: var(--txt-muted); }
#frameContent { display: none; width: 100%; min-height: 100vh; border: none; }
</style>
</head>
<body>

<div id="screenPin">
  <div class="pin-icon">📐</div>
  <h2 class="pin-title">GUIA DE UNIDADES ATEQ</h2>
  <p class="pin-desc">Introduza o PIN de segurança ATEQ para consultar:</p>

  <div class="pin-dots">
    <div class="pin-dot" id="dot0"></div>
    <div class="pin-dot" id="dot1"></div>
    <div class="pin-dot" id="dot2"></div>
    <div class="pin-dot" id="dot3"></div>
  </div>

  <div class="pin-pad">
    <button class="pad-btn" onclick="pressKey('1')">1</button>
    <button class="pad-btn" onclick="pressKey('2')">2</button>
    <button class="pad-btn" onclick="pressKey('3')">3</button>
    <button class="pad-btn" onclick="pressKey('4')">4</button>
    <button class="pad-btn" onclick="pressKey('5')">5</button>
    <button class="pad-btn" onclick="pressKey('6')">6</button>
    <button class="pad-btn" onclick="pressKey('7')">7</button>
    <button class="pad-btn" onclick="pressKey('8')">8</button>
    <button class="pad-btn" onclick="pressKey('9')">9</button>
    <button class="pad-btn action" onclick="clearPin()">LIMPAR</button>
    <button class="pad-btn" onclick="pressKey('0')">0</button>
    <button class="pad-btn action" onclick="backspacePin()">APAGAR</button>
  </div>
</div>

<iframe id="frameContent"></iframe>

let currentPin = "";

function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) {
    bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
  }
  return bytes;
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) {
    bytes[i] = bin.charCodeAt(i);
  }
  return bytes;
}

async function unlockWithPin(pinStr) {
  try {
    const enc = new TextEncoder();
    const salt = hexToBytes(CIPHER_DATA.salt);
    const iv = hexToBytes(CIPHER_DATA.iv);
    const ciphertext = b64ToBytes(CIPHER_DATA.cipher);

    const pinKey = await crypto.subtle.importKey(
      "raw", enc.encode(pinStr), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    const aesKey = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      pinKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );

    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv }, aesKey, ciphertext
    );

    const decStr = new TextDecoder().decode(decrypted);

    document.getElementById("screenPin").style.display = "none";
    const iframe = document.getElementById("frameContent");
    iframe.style.display = "block";
    iframe.contentWindow.document.open();
    iframe.contentWindow.document.write(decStr);
    iframe.contentWindow.document.close();
  } catch (e) {
    clearPin();
    alert("PIN Incorreto!");
  }
}

function pressKey(num) {
  if (currentPin.length < 4) {
    currentPin += num;
    updateDots();
    if (currentPin.length === 4) {
      setTimeout(() => unlockWithPin(currentPin), 50);
    }
  }
}

function clearPin() { currentPin = ""; updateDots(); }
function backspacePin() { if (currentPin.length > 0) { currentPin = currentPin.slice(0, -1); updateDots(); } }
function updateDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById("dot" + i);
    if (i < currentPin.length) { dot.classList.add("filled"); } else { dot.classList.remove("filled"); }
  }
}

// Check saved pin
const saved = localStorage.getItem("ateq_planner_saved_pin");
if (saved) unlockWithPin(saved);
