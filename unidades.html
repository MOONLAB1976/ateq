<title>ATEQ · Guia Prático de Unidades Metrológicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --az-prim: #0B3C6F;
  --az-light: #1C5AA0;
  --az-sub: #072545;
  --bg: #F4F7FA;
  --card: #FFFFFF;
  --txt: #16202A;
  --txt-muted: #516170;
  --linha: #D3DBE3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "IBM Plex Sans", sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
}
#screenPin {
  max-width: 360px;
  margin: 50px auto;
  padding: 30px 20px;
  background: #fff;
  border-radius: 16px;
  border: 1px solid var(--linha);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  text-align: center;
}
.pin-icon { font-size: 40px; margin-bottom: 12px; }
.pin-title { font-size: 22px; font-weight: 700; color: var(--az-prim); }
.pin-desc { font-size: 13px; color: var(--txt-muted); margin-top: 4px; margin-bottom: 24px; }
.pin-dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 24px; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--az-prim); background: transparent; transition: all 0.2s; }
.pin-dot.filled { background: var(--az-prim); transform: scale(1.15); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 260px; margin: 0 auto 20px; }
.pad-btn { height: 56px; background: var(--bg); border: 1px solid var(--linha); border-radius: 12px; font-size: 22px; font-weight: 700; color: var(--txt); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.pad-btn:active { background: var(--az-light); color: #fff; transform: scale(0.94); }
.pad-btn.action { font-size: 13px; font-weight: 600; color: var(--txt-muted); }
#frameContent { display: none; width: 100%; min-height: 100vh; border: none; }

/* ECRÃ DE PALAVRA-PASSE ALFANUMÉRICA */
#screenPin {
  max-width: 380px;
  margin: 40px auto;
  padding: 32px 24px;
  background: var(--card, #ffffff);
  border-radius: 20px;
  border: 1px solid var(--linha, #D3DBE3);
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  text-align: center;
}
.pin-icon { font-size: 42px; margin-bottom: 12px; }
.pin-title {
  font-family: var(--font-display, sans-serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--az-prim, #0B3C6F);
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.pin-desc {
  font-size: 13.5px;
  color: var(--txt-muted, #516170);
  line-height: 1.4;
  margin-bottom: 22px;
}
.pass-input-wrap {
  display: flex;
  align-items: center;
  background: var(--bg, #F4F7FA);
  border: 1.5px solid var(--linha, #D3DBE3);
  border-radius: 12px;
  padding: 2px 8px;
  margin-bottom: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.pass-input-wrap:focus-within {
  border-color: var(--az-light, #1C5AA0);
  box-shadow: 0 0 0 3px rgba(28, 90, 160, 0.15);
  background: #ffffff;
}
.pass-input {
  flex: 1;
  height: 48px;
  border: none;
  background: transparent;
  font-size: 16px;
  font-family: inherit;
  color: var(--txt, #16202A);
  padding: 0 8px;
  outline: none;
}
.btn-eye {
  background: transparent;
  border: none;
  font-size: 18px;
  cursor: pointer;
  padding: 8px;
  color: var(--txt-muted, #516170);
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-unlock {
  width: 100%;
  height: 50px;
  background: var(--az-prim, #0B3C6F);
  color: #ffffff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
}
.btn-unlock:hover {
  background: var(--az-light, #1C5AA0);
}
.btn-unlock:active {
  transform: scale(0.98);
}
.pin-error {
  min-height: 22px;
  font-size: 13px;
  font-weight: 600;
  color: #B3261E;
  margin-top: 10px;
  margin-bottom: 8px;
}
.pin-remember {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13px;
  color: var(--txt-muted, #516170);
  margin-top: 10px;
  cursor: pointer;
}

</style>
</head>
<body>

<div id="screenPin">
  <div class="pin-icon">📐</div>
  <h2 class="pin-title">GUIA DE UNIDADES ATEQ</h2>
  <p class="pin-desc">Introduza a palavra-passe ATEQ para consultar:</p>

  <div class="pass-input-wrap">
    <input type="password" id="inputPass" class="pass-input" placeholder="Palavra-passe (ateq1617)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitPassword()">
    <button type="button" class="btn-eye" id="btnEye" onclick="togglePassEye()">👁️</button>
  </div>

  <button type="button" class="btn-unlock" onclick="submitPassword()">DESBLOQUEAR</button>
  <div class="pin-error" id="pinErrorMsg"></div>

  <label class="pin-remember">
    <input type="checkbox" id="chkRemember" checked>
    <span>Manter sessão ativa neste telemóvel</span>
  </label>
</div>

<iframe id="frameContent"></iframe>

function togglePassEye() {
  const inp = document.getElementById("inputPass");
  const eye = document.getElementById("btnEye");
  if (inp.type === "password") {
    inp.type = "text";
    eye.innerText = "🔒";
  } else {
    inp.type = "password";
    eye.innerText = "👁️";
  }
}

function submitPassword() {
  const inp = document.getElementById("inputPass");
  const val = inp.value.trim().toLowerCase();
  if (!val) {
    document.getElementById("pinErrorMsg").innerText = "Introduza a palavra-passe.";
    return;
  }
  unlockUnidades(val);
}

async function unlockUnidades(passStr) {
  try {
    const normPass = passStr.trim().toLowerCase();
    const enc = new TextEncoder();
    const salt = hexToBytes(CIPHER_DATA.salt);
    const iv = hexToBytes(CIPHER_DATA.iv);
    const ciphertext = b64ToBytes(CIPHER_DATA.cipher);

    const pinKey = await crypto.subtle.importKey(
      "raw", enc.encode(normPass), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    const aesKey = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      pinKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );

    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv }, aesKey, ciphertext
    );

    const decStr = new TextDecoder().decode(decrypted);

    if (document.getElementById("chkRemember").checked) {
      localStorage.setItem("ateq_unidades_saved_pass", normPass);
    }

    document.getElementById("screenPin").style.display = "none";
    const iframe = document.getElementById("frameContent");
    iframe.style.display = "block";
    iframe.contentWindow.document.open();
    iframe.contentWindow.document.write(decStr);
    iframe.contentWindow.document.close();
  } catch (e) {
    console.error(e);
    document.getElementById("pinErrorMsg").innerText = "Palavra-passe incorreta!";
  }
}

window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("ateq_unidades_saved_pass");
  if (saved) unlockUnidades(saved);
});

// Check saved pin
const saved = localStorage.getItem("ateq_planner_saved_pin");
if (saved) unlockWithPin(saved);
